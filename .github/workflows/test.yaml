---
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a branch cancels its older, still-running test runs.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every suite in one job, so pull requests have a single tests check.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start test databases
        run: pnpm test:db:up

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Vitest (unit and integration) and Playwright run at the same time.
      # They use separate workspace databases, so they don't collide.
      - name: Run tests
        run: pnpm test:all

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
